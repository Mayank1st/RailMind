# ════════════════════════════════════════════════════════════════════════════════
# RailMind - Docker Compose Configuration
# Local development stack: FastAPI + PostgreSQL + Redis + Celery
#
# Run from the repo root:
#   docker compose --env-file .env -f docker/docker-compose.yml up --build
#
# --env-file .env  → lets Postgres read its init creds (${DB_PASSWORD} etc.) from
#                    .env, so the DB password is NEVER hard-coded into this
#                    committed file. Without it, the postgres service errors out.
# env_file: ../.env (per service, below) injects the full app config into the
#                    backend/worker containers.
# (relative paths ../.env, ../app, .. resolve against this file's dir.)
#
# Config model: the app (app/config.py) reads individual DB_* / SUPABASE_* / etc.
# vars, NOT a single DATABASE_URL. All of them come from the repo-root .env. Only
# the values that differ inside the Docker network (DB_HOST, REDIS_URL) are
# overridden in `environment:`, which takes precedence over env_file.
# ════════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # Init creds are read from the repo-root .env (via --env-file .env) so they
  # always match what the backend authenticates with — and so the password is
  # never committed to git. NOTE: POSTGRES_* only take effect on FIRST init of an
  # empty data volume; changing them later does NOT re-key an existing volume.
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: railmind_postgres
    environment:
      POSTGRES_USER: "${DB_USERNAME:?set DB_USERNAME (run with --env-file .env)}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD (run with --env-file .env)}"
      POSTGRES_DB: "${DB_NAME:?set DB_NAME (run with --env-file .env)}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-railmind} -d ${DB_NAME:-railmind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railmind_network

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis Cache & Session Store
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: railmind_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railmind_network

  # ─────────────────────────────────────────────────────────────────────────────
  # FastAPI Backend Application
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: railmind_backend
    ports:
      - "8000:8000"
    # All app settings come from the repo-root .env ...
    env_file:
      - ../.env
    # ... except the values that must point at sibling containers, not localhost.
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount source for hot reload (comment out for prod-like testing)
      - ../app:/app/app
      - ../alembic:/app/alembic
    networks:
      - railmind_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────────────────────────────────────────────────────────────────────
  # Celery Worker (for background tasks)
  # ─────────────────────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: railmind_celery_worker
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../app:/app/app
    networks:
      - railmind_network
    command: celery -A app.tasks.celery_app worker --loglevel=info

  # ─────────────────────────────────────────────────────────────────────────────
  # Celery Beat (for scheduled tasks - Phase 2+)
  # ─────────────────────────────────────────────────────────────────────────────
  celery_beat:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: railmind_celery_beat
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - railmind_network
    command: celery -A app.tasks.celery_app beat --loglevel=info

# ─────────────────────────────────────────────────────────────────────────────
# Named Volumes for Data Persistence
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Custom Network
# ─────────────────────────────────────────────────────────────────────────────
networks:
  railmind_network:
    driver: bridge
